<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>River water chemistry</title>
<style>
  :root {
    --bg: #f5f8f7; --panel: #ffffff; --ink: #14272b; --muted: #5b6f73; --line: #d5e0de; --accent: #0f6b7a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1a1d; --panel: #14262a; --ink: #e3eeee; --muted: #8fa6a9; --line: #264045; --accent: #4cc3d4; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Source Sans 3", system-ui, sans-serif; }
  header { padding: 1.5rem clamp(1rem, 4vw, 3rem) .5rem; }
  h1 { margin: 0; font-size: 1.6rem; font-weight: 650; }
  header p { margin: .25rem 0 0; color: var(--muted); max-width: 60ch; }
  main { display: grid; grid-template-columns: 260px 1fr; gap: 1rem; padding: 1rem clamp(1rem, 4vw, 3rem) 3rem; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  aside, #chart-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1rem; }
  label, legend { font-weight: 600; font-size: .9rem; }
  fieldset { border: 0; padding: 0; margin: 0 0 1rem; }
  select, input[type=date] { width: 100%; padding: .4rem; margin-top: .25rem; border: 1px solid var(--line);
    border-radius: 4px; background: var(--bg); color: var(--ink); font: inherit; }
  .field { margin-bottom: 1rem; }
  .river { display: flex; align-items: center; gap: .5rem; padding: .15rem 0; font-weight: 400; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .row { display: flex; gap: .5rem; }
  #chart { width: 100%; height: 520px; }
  #status { color: var(--muted); padding: 1rem 0; }
  #status.error { color: #b3261e; }
  #note { color: var(--muted); font-size: .85rem; margin: .5rem 0 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>River water chemistry</h1>
  <p>Pick a parameter and the rivers to compare. Drag on the chart to zoom, double-click to reset.</p>
</header>

<main>
  <aside>
    <div class="field">
      <label for="param">Parameter</label>
      <select id="param"></select>
    </div>
    <fieldset id="rivers"><legend>Rivers</legend></fieldset>
    <div class="field">
      <label>Date range</label>
      <div class="row">
        <input type="date" id="from" aria-label="From date">
        <input type="date" id="to" aria-label="To date">
      </div>
    </div>
    <div class="field">
      <label for="mode">Display</label>
      <select id="mode">
        <option value="lines+markers">Lines and points</option>
        <option value="markers">Points only</option>
        <option value="lines">Lines only</option>
      </select>
    </div>
  </aside>

  <section id="chart-wrap">
    <div id="status">Loading data…</div>
    <div id="chart"></div>
    <p id="note" hidden></p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.2/plotly.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
/* ---------- CONFIG ----------
   Expected repo layout (this page goes in the repo root):
     RiverName/pH.csv
     RiverName/DO.csv
     RiverName/water_level.csv
   Folder name = river. File name = parameter (when a file has a single data column).
   If a file has several data columns, each column header is treated as a parameter instead.
   The page finds every CSV by asking GitHub for the repo's file list, so there is no manifest to maintain. */
const OWNER  = "GWLab-UML";
const REPO   = "Massachusetts_WaterQuality";
const BRANCH = "HEAD";     // HEAD = the repo's default branch
const FOLDER = "";         // set e.g. "data/" if all river folders sit inside one parent folder

const DATE_COL = /^(date|datetime|date_time|sample_date|timestamp|time)$/i;
const PALETTE = ["#0f6b7a", "#d9822b", "#6a4c93", "#3a9d5d", "#c23b57", "#8a8d1f", "#2f6fdb", "#7a5c3e"];

const state = { rivers: [], params: new Map(), skipped: [] };  // params: key -> display label
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const pretty = s => s.replace(/_/g, " ").trim();
const urlFor = path => path.split("/").map(encodeURIComponent).join("/");

async function listCsvPaths() {
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);
  if (!res.ok) throw new Error(`Couldn't list repo files (HTTP ${res.status}). Check OWNER, REPO and that the repo is public.`);
  const tree = await res.json();
  return tree.tree
    .filter(t => t.type === "blob" && /\.csv$/i.test(t.path) && t.path.startsWith(FOLDER))
    .map(t => t.path);
}

async function loadFile(path) {
  const rel = path.slice(FOLDER.length).split("/");
  if (rel.length < 2) return [];                      // CSV not inside a river folder: ignore
  const river = pretty(rel[0]);
  const fileLabel = pretty(rel[rel.length - 1].replace(/\.csv$/i, ""));

  const res = await fetch(urlFor(path));
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  const { data, meta } = Papa.parse(await res.text(), {
    header: true, dynamicTyping: true, skipEmptyLines: true, transformHeader: h => h.trim()
  });

  const dateKey = meta.fields.find(f => DATE_COL.test(f));
  if (!dateKey) throw new Error(`${path}: no date column`);
  const cols = meta.fields.filter(f => f !== dateKey && data.some(r => typeof r[f] === "number"));
  if (!cols.length) throw new Error(`${path}: no numeric columns`);

  return cols.map(c => {
    const label = cols.length === 1 ? fileLabel : pretty(c);
    const rows = data
      .map(r => ({ date: new Date(r[dateKey]), value: r[c] }))
      .filter(r => !isNaN(r.date) && typeof r.value === "number");
    return { river, label, rows };
  });
}

async function init() {
  try {
    const paths = await listCsvPaths();
    const results = await Promise.allSettled(paths.map(loadFile));

    const byRiver = new Map();                         // river -> { paramKey -> rows[] }
    results.forEach((r, i) => {
      if (r.status === "rejected") { state.skipped.push(r.reason.message); return; }
      r.value.forEach(({ river, label, rows }) => {
        const key = label.toLowerCase();
        if (!state.params.has(key)) state.params.set(key, label);
        if (!byRiver.has(river)) byRiver.set(river, {});
        const series = byRiver.get(river);
        series[key] = (series[key] || []).concat(rows);
      });
    });
    if (!byRiver.size) throw new Error("No usable CSV files were found in river folders.");

    state.rivers = [...byRiver].sort((a, b) => a[0].localeCompare(b[0])).map(([name, series], i) => {
      Object.values(series).forEach(rows => rows.sort((a, b) => a.date - b.date));
      return { name, series, color: PALETTE[i % PALETTE.length] };
    });

    buildControls();
    $("status").hidden = true;
    if (state.skipped.length) {
      $("note").hidden = false;
      $("note").textContent = `${state.skipped.length} file(s) were skipped: ` + state.skipped.join("; ");
    }
    draw();
  } catch (err) {
    $("status").className = "error";
    $("status").textContent = "Couldn't load data. " + err.message;
  }
}

function buildControls() {
  const params = [...state.params].sort((a, b) => a[1].localeCompare(b[1]));
  $("param").innerHTML = params.map(([k, l]) => `<option value="${k}">${l}</option>`).join("");
  $("rivers").insertAdjacentHTML("beforeend", state.rivers.map((r, i) => `
    <label class="river">
      <input type="checkbox" data-i="${i}" checked>
      <span class="swatch" style="background:${r.color}"></span>${r.name}
    </label>`).join(""));

  const times = state.rivers.flatMap(r => Object.values(r.series).flat().map(x => +x.date));
  $("from").value = new Date(Math.min(...times)).toISOString().slice(0, 10);
  $("to").value = new Date(Math.max(...times)).toISOString().slice(0, 10);

  document.querySelectorAll("aside select, aside input").forEach(el => el.addEventListener("change", draw));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
}

function draw() {
  const key = $("param").value;
  const label = state.params.get(key);
  const from = new Date($("from").value), to = new Date($("to").value + "T23:59:59");
  const picked = [...document.querySelectorAll("#rivers input:checked")].map(el => state.rivers[+el.dataset.i]);

  const traces = picked.filter(r => r.series[key]).map(r => {
    const rows = r.series[key].filter(x => x.date >= from && x.date <= to);
    return {
      x: rows.map(x => x.date), y: rows.map(x => x.value),
      name: r.name, type: "scattergl", mode: $("mode").value,
      line: { color: r.color, width: 1.5 }, marker: { color: r.color, size: 5 },
      hovertemplate: "%{x|%d %b %Y}<br>%{y}<extra>" + r.name + "</extra>"
    };
  });

  const ink = css("--ink"), grid = css("--line");
  Plotly.react("chart", traces, {
    margin: { t: 20, r: 20, b: 50, l: 60 },
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    font: { color: ink, family: "Source Sans 3, system-ui, sans-serif" },
    xaxis: { gridcolor: grid, linecolor: grid },
    yaxis: { title: label, gridcolor: grid, linecolor: grid, zeroline: false },
    legend: { orientation: "h", y: -0.15 },
    hovermode: "closest"
  }, { responsive: true, displaylogo: false });
}

init();
</script>
</body>
</html>
