  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1180px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }

    /* Hero Section */
    .hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 2.5rem; align-items: start; margin-bottom: 3.5rem; }
    .hero h1 { font-size: 2.75rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; margin: 0 0 1.25rem; }
    .hero p { font-size: 1.05rem; color: #334155; margin: 0 0 2rem; max-width: 60ch; }
    .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .kpi-box { border-top: 2px solid var(--text); padding-top: 0.75rem; }
    .kpi-num { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
    .kpi-label { font-size: 0.85rem; color: var(--muted); margin-top: 0.25rem; }
    .hero-aside { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; font-size: 0.9rem; color: #475569; }
    .hero-aside strong { color: var(--text); display: block; margin-bottom: 0.35rem; }

    /* Section Headers & Pill Toggles */
    section { margin-bottom: 4rem; }
    .section-header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end;
      gap: 1rem; padding-bottom: 1rem; border-bottom: 1.5px solid var(--text); margin-bottom: 1.5rem;
    }
    .section-header h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
    .section-header p { font-size: 0.92rem; color: var(--muted); margin: 0.2rem 0 0; }

    .pill-group { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .pill {
      display: inline-flex; align-items: center; gap: 0.45rem;
      padding: 0.42rem 0.9rem; border-radius: 999px; font-size: 0.85rem; font-weight: 500;
      border: 1px solid var(--border); background: #fff; color: var(--text); cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill:hover { border-color: #94a3b8; }
    .pill.active { background: var(--text); color: #fff; border-color: var(--text); }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    /* Explore the Sites 2-Col Grid */
    .explore-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 1.5rem; align-items: stretch; }
    #map { height: 450px; border-radius: 12px; border: 1px solid var(--border); z-index: 1; }
    .site-panel {
      border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem;
      display: flex; flex-direction: column; justify-content: space-between; background: #fff;
    }
    .site-card-item {
      border: 1px solid var(--border); border-radius: 10px; padding: 0.95rem 1.1rem;
      margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .site-card-item:hover { background: var(--surface); border-color: #94a3b8; }

      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
